name: Mooring Weather Watch

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test email without checking the forecast"
        required: false
        type: boolean
        default: false

jobs:
  check-weather:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore alert state
        uses: actions/cache/restore@v5
        with:
          path: .weather-state.json
          key: weather-state-${{ github.run_id }}
          restore-keys: |
            weather-state-

      - run: pip install -r requirements.txt

      - name: Check wind limits
        env:
          USER_AGENT: "mooring-weather-watch/1.0 nick@enjoyneering.dk"
          EMAIL_TO: "nick@enjoyneering.dk,jesper@d3-consulting.com"
          EMAIL_FROM: "Mooring Weather Watch <weather@alerts.enjoyneering.dk>"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test || false }}
        run: python monitor.py

      - name: Save alert state
        if: always() && hashFiles('.weather-state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .weather-state.json
          key: weather-state-${{ github.run_id }}
